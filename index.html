<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AGRO Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <section id="menu">
        <div class="logo">
            <img src="assest/logo.png" alt="">
            <h2>AGRO</h2>
        </div>

        <div class="items">
            <li><i class="material-symbols-outlined">home</i><a href="#"> Home</a></li>
            <li><i class="material-symbols-outlined">add</i><a href="#"> Add</a></li>
            <li><i class="material-symbols-outlined">edit</i><a href="#"> Edit</a></li>
            <li><i class="material-symbols-outlined">delete</i><a href="#"> Delete</a></li>
            <li><i class="material-symbols-outlined">settings</i><a href="#"> Setting</a></li>
            <li><i class="material-symbols-outlined">logout</i><a href="#"> Logout</a></li>
            <li><i class="material-symbols-outlined"> more_vert</i><a href="#"> More</a></li>
        </div>
    </section>


    <section id="interface">
        <div class="navigation">
            <div class="n1">
                <div class="search">
                    <i class="material-symbols-outlined">search</i>
                    <input type="text" placeholder="Search">
                </div>
            </div>

            <div class="profile">
                <i class="material-symbols-outlined">notifications</i>
                <img src="assest/1.jpeg" alt="">
            </div>
        </div>

        <h3 class="i-name">
           Home
        </h3>

        <div class="values">
            <div class="val-box">
                <i class="material-symbols-outlined">group</i>
                <div>
                    <h3>1,325</h3>
                    <span>New Users</span>
                </div>
            </div>
            <div class="val-box">
                <i class="material-symbols-outlined">grass</i>
                <div>
                    <h3>10</h3>
                    <span>Vegitables</span>
                </div>
            </div>
            <div class="val-box">
                <i class="material-symbols-outlined">nutrition</i>
                <div>
                    <h3>20</h3>
                    <span>Fruits</span>
                </div>
            </div>
            <div class="val-box">
                <i class="material-symbols-outlined">eco</i>
                <div>
                    <h3>0000</h3>
                    <span>Others</span>
                </div>
            </div>
        </div>
    </section>




</body>


</html>
